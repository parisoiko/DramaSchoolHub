name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore DramaSchoolHub.slnx

      - name: Build
        run: dotnet build DramaSchoolHub.slnx --no-restore -c Release

      # Unit tests + integration tests (the app runs in memory; no external services needed)
      - name: Test
        run: dotnet test DramaSchoolHub.slnx --no-build -c Release --verbosity normal
